name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and package Windows x64
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run version normalization checks
        run: dotnet run --project tests/VersionSmoke/VersionSmoke.csproj --configuration Release
      - name: Validate real curated theme archives
        run: dotnet run --project tests/VersionSmoke/VersionSmoke.csproj --configuration Release -- --theme-integration
      - name: Test curated script installer on Windows
        shell: pwsh
        run: |
          dotnet run --project tests/VersionSmoke/VersionSmoke.csproj --configuration Release -- --library-integration
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify real Godot 4 Aseprite Wizard package and reversible install
        shell: pwsh
        run: |
          dotnet run --project tests/VersionSmoke/VersionSmoke.csproj --configuration Release -- --godot-integration
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate curated palette preview gallery
        shell: pwsh
        run: |
          dotnet run --project tests/VersionSmoke/VersionSmoke.csproj --configuration Release -- --palette-integration
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify real Tile Index extension install and uninstall
        shell: pwsh
        run: |
          dotnet run --project tests/VersionSmoke/VersionSmoke.csproj --configuration Release -- --overlay-integration
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Godot Wizard loading in actual Godot 4.7.2 editor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'godot-4.7.2.zip'
          Invoke-WebRequest 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip' -OutFile $zip
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953') {
            throw "Godot ZIP checksum mismatch: $sha"
          }
          $bin = Join-Path $env:RUNNER_TEMP 'godot-wizard-bin'
          Expand-Archive $zip $bin
          $godot = Get-ChildItem $bin -Recurse -Filter '*win64_console.exe' | Select-Object -First 1
          if ($null -eq $godot) { throw 'Pinned Godot executable missing' }
          dotnet run --project tests/VersionSmoke/VersionSmoke.csproj --configuration Release -- --godot-editor-fixture
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the Godot editor fixture' }
          $fixture = Join-Path $env:TEMP 'AsepriteWizardGodotEditorCI'
          $logPath = Join-Path $env:RUNNER_TEMP 'godot-wizard-editor.log'
          & $godot.FullName --headless --editor --path $fixture --quit-after 55 --log-file $logPath 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'godot-wizard-stdout.log')
          if ($LASTEXITCODE -ne 0) { throw "Godot editor exited with code $LASTEXITCODE" }
          $log = (Get-Content $logPath -Raw) + (Get-Content (Join-Path $env:RUNNER_TEMP 'godot-wizard-stdout.log') -Raw)
          if ($log -match '(?im)(SCRIPT ERROR|Parse Error|ERROR:|Failed loading script)') {
            throw "Godot reported plugin errors: $log"
          }
          Write-Host 'PASS: Godot 4.7.2 loaded installed Wizard without reported parser/editor errors.'
      - name: Restore WPF app
        run: dotnet restore src/AsepriteManager/AsepriteManager.csproj
      - name: Build WPF app
        run: dotnet build src/AsepriteManager/AsepriteManager.csproj -c Release --no-restore
      - name: Verify WPF layout at multiple sizes
        shell: pwsh
        run: |
          dotnet run --project src/AsepriteManager/AsepriteManager.csproj --configuration Release --no-build -- --layout-smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish self-contained Windows app
        run: dotnet publish src/AsepriteManager/AsepriteManager.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Create Windows installer
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler was not installed." }
          & $compiler 'installer\AsepriteManager.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: AsepriteManager-Windows-x64
          path: |
            dist/*.exe
            publish/AsepriteManager.exe
            ui-snapshots/*.png
          if-no-files-found: error
